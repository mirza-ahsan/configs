# Reference pyproject for a GPU ML venv managed by uv (PyTorch CUDA wheels + TensorFlow CUDA libs).
# Copy the [project.dependencies] GPU lines and the [tool.uv*] tables into a project; see docs/05-dev-toolchains.md.
[project]
name = "aiml"
version = "0.1.0"
description = "Python directory for aiml"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorflow[and-cuda]>=2.16.0",
    "torch",
    "torchaudio",
    "torchvision",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B018"]

[tool.black]
line-length = 120


