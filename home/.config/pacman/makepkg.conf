# Per-user makepkg settings, read after /etc/makepkg.conf (yay and `omarchy pkg aur add` build through makepkg).
# Only the http/https download agents change: GitHub release downloads go through aria2c with 16 connections,
# everything else still uses curl exactly as /etc/makepkg.conf does (see ~/.local/bin/makepkg-dlagent).
DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          "http::$HOME/.local/bin/makepkg-dlagent %o %u"
          "https::$HOME/.local/bin/makepkg-dlagent %o %u"
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')
