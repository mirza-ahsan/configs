# Personal tmux overrides, sourced at the end of ~/.config/tmux/tmux.conf.
# Behavior and keybinds only; colors stay with Omarchy's theme.

# Prefix: CTRL+S only (replaces Omarchy's CTRL+Space / CTRL+B)
set -g prefix C-s
set -g prefix2 None
unbind C-Space

# <prefix> r reloads the config (Omarchy had r = rename window; "," still renames)
unbind r
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vim-style pane movement (replaces Omarchy's h = split, k = kill window)
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

# <prefix> CTRL+L clears the screen
unbind C-l
bind -N "Clear screen" C-l send-keys C-l

# --- Latency & Performance ---
# No ESC delay (Omarchy sets 10ms)
set -sg escape-time 0
set -g repeat-time 300
set -g display-time 4000

# Spawn a non-login interactive shell for every new window/pane instead of a
# login shell, skipping /etc/profile + profile.d on each split.
set -g default-command 'exec ${SHELL:-/bin/bash}'

# Truecolor and image passthrough for Ghostty / Neovim
# Ghostty: truecolor, synchronized output (whole-frame redraws, no tearing)
# and extended keys (Ctrl+Shift+<key> etc. reach apps inside tmux)
set -as terminal-features ",xterm-ghostty:RGB:sync:extkeys"
set -as terminal-overrides ",xterm-ghostty:Tc"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Status bar at the bottom (look comes from Omarchy's theme)
set -g status-position bottom
# tmux 3.8 underlines the current window name by default; Omarchy's format
# already marks it with color + bold
set -g window-status-current-style default
# <prefix> t clock in 12-hour time
setw -g clock-mode-style 12

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Manual save/restore: <prefix> CTRL+S / <prefix> CTRL+R
set -g @resurrect-dir '~/.tmux/resurrect'

run-shell -b 'if [ -f ~/.config/tmux/plugins/tpm/tpm ]; then ~/.config/tmux/plugins/tpm/tpm; fi'

# Pane switching with <prefix> arrow is not repeatable (tmux default is -r),
# so an arrow typed right after it goes to the shell/editor instead of
# switching panes again. Resize binds stay repeatable.
bind -N "Focus pane up" Up select-pane -U
bind -N "Focus pane down" Down select-pane -D
bind -N "Focus pane left" Left select-pane -L
bind -N "Focus pane right" Right select-pane -R
