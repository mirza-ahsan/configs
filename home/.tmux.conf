# Reload tmux configuration for all tmux sessions using '<leader>r'
unbind r
bind r source-file ~/.tmux.conf

# Set leader to CTRL + S
set -g prefix C-s

# Enable mouse resizing & selection
set -g mouse on

# --- Latency & Performance Optimizations ---
# Eliminate delay when pressing ESC key (essential for Vim/Neovim & shell responsiveness)
set -s escape-time 0

# Spawn a NON-LOGIN interactive shell for every new window/pane.
# tmux's default (empty default-command) starts a *login* shell, which re-runs
# /etc/profile + /etc/profile.d/*.sh + ~/.zprofile on every single new window.
# Measured cost: ~64ms, and it lands *before* powerlevel10k's instant prompt can
# paint, so it is 64ms of visibly blank pane. Ghostty already spawns a non-login
# shell, which is why tmux felt slower than the native terminal.
# `exec` replaces the /bin/sh wrapper, so the process tree is unchanged.
set -g default-command 'exec ${SHELL:-/usr/bin/zsh}'

# Reduce repeat timeout
set -g repeat-time 300

# Enable focus events for modern terminal apps & Neovim
set -g focus-events on

# Increase history scrollback buffer size
set -g history-limit 50000

# Display tmux messages longer (4000ms)
set -g display-time 4000

# Auto-renumber window indexes when a window is closed
set -g renumber-windows on

# Automatic window rename
setw -g automatic-rename on

# Use Vi keybindings in copy mode
setw -g mode-keys vi

# Terminal TrueColor & 256-color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-overrides ",xterm-256color:Tc"

# Image nvim support & environment pass-through
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Fix Ctrl+L for clear screen
unbind C-l
bind C-l send-keys C-l

# Remap navigation keys (Vim-style pane movement)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# --- Visual Styling & Status Bar (Spider-Man Red & Cyan on Transparent BG) ---
set -g status-position bottom
set -g status on
set -g status-style bg=default,fg=#5c677d
set -g status-interval 5

# Left: session name (Spider-Man Crimson Red)
set -g status-left-length 30
set -g status-left "#[fg=#ff2a4b,bold]#S  #[default]"

# Right: clean minimal / empty
set -g status-right-length 0
set -g status-right ""

# Window styling (Muted inactive, Electric Cyan active)
set-window-option -g window-status-format "#[fg=#5c677d]#I:#W#F  "
set-window-option -g window-status-current-format "#[fg=#00b4d8,bold]#I:#W#F  "

# Pane border styling
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Message text (prompt boxes, etc.)
set -g message-style bg=colour235,fg=colour51

# Copy mode style
set -g mode-style bg=colour238,fg=colour231

# --- Tmux Plugin Manager ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Configure tmux-resurrect (manual save/restore with prefix + Ctrl-s / Ctrl-r)
set -g @resurrect-dir '~/.tmux/resurrect'

# Initialize TMUX plugin manager
run-shell -b 'if [ -f ~/.tmux/plugins/tpm/tpm ]; then ~/.tmux/plugins/tpm/tpm; fi'
