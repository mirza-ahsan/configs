# Reload tmux configuration for all tmux sessions using '<leader>r'
unbind r
bind r source-file ~/.tmux.conf

# Set leader to CTRL + S
set -g prefix C-s

# Enable mouse resizing & selection
set -g mouse on

# --- Latency & Performance Optimizations ---
# Eliminate delay when pressing ESC key (essential for Vim/Neovim & shell responsiveness)
set -s escape-time 0

# Reduce repeat timeout
set -s repeat-time 300

# Enable focus events for modern terminal apps & Neovim
set -g focus-events on

# Increase history scrollback buffer size
set -g history-limit 50000

# Display tmux messages longer (4000ms)
set -g display-time 4000

# Auto-renumber window indexes when a window is closed
set -g renumber-windows on

# Automatic window rename
setw -g automatic-rename on

# Use Vi keybindings in copy mode
setw -g mode-keys vi

# Terminal TrueColor & 256-color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

# Image nvim support & environment pass-through
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Fix Ctrl+L for clear screen
unbind C-l
bind C-l send-keys C-l

# Remap navigation keys (Vim-style pane movement)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# Customise Status bar
set -g status-position bottom
set -g status on
set -g status-bg colour235     # Dark gray background
set -g status-fg colour245     # Light gray text
set -g status-interval 5

# Left: session name
set -g status-left-length 20
set -g status-left "#[fg=colour231,bold] #S #[default]"

# Right: user and date/time (Optimized: using #U instead of subshell #(whoami))
set -g status-right-length 50
set -g status-right "#[fg=colour241]#U #[fg=colour240]| %Y-%m-%d %H:%M "

# Window styling
set-window-option -g window-status-format " #[fg=colour245]#I:#W "
set-window-option -g window-status-current-format " #[fg=colour231,bold]#[bg=colour236]#I:#W#[default] "

# Pane border styling
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Message text (prompt boxes, etc.)
set -g message-style bg=colour235,fg=colour51

# Copy mode style
set -g mode-style bg=colour238,fg=colour231

# Tmux Plugin Manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore session state on tmux launch, but only if a resurrect
# save file already exists. Run via run-shell -b (background) so this
# executes AFTER tmux has created its first session — doing this check
# synchronously in the config (via plain if-shell) fails with
# "no current session" on the very first launch, since tmux parses
# .tmux.conf before any session exists yet.
run-shell -b 'if [ -f ~/.tmux/resurrect/last ]; then \
    tmux set -g @continuum-restore "on"; \
  else \
    tmux set -g @continuum-restore "off"; \
  fi'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Guarded so a brand-new machine without tpm cloned yet doesn't error out,
# and backgrounded for the same "no current session" reason as above
run-shell -b 'if [ -f ~/.tmux/plugins/tpm/tpm ]; then ~/.tmux/plugins/tpm/tpm; fi'
